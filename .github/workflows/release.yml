name: "Create release"
on:
  workflow_dispatch:
  push:
    tags:
      - v*.*.*

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.CI_PAT }}
        run: |
          gh release create ${{ github.ref_name }} -t "EBSL ${{ github.ref_name }}" -R aarikpokras/ebsl -F inter-changelog.md
